<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BORNTOWIN5 — Mobile Viewport Verification Workbench (360px / 390px / 430px)</title>
<link rel="stylesheet" href="b5-design-system.css">
<style>
  body {
    margin: 0;
    background: #042619 !important;
    color: #F6F4EE !important;
    font-family: Inter, system-ui, -apple-system, sans-serif !important;
  }
  .wb-header {
    background: #031B12;
    border-bottom: 1px solid rgba(197, 155, 56, 0.45);
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .wb-title b {
    font-size: 16px;
    color: #FFFFFF;
    display: block;
  }
  .wb-title small {
    font-size: 12px;
    color: #C59B38;
  }
  .wb-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .wb-btn {
    width: auto !important;
    min-height: 38px !important;
    padding: 8px 14px !important;
    border-radius: 999px !important;
    background: rgba(255, 255, 255, 0.1) !important;
    color: #FFFFFF !important;
    border: 1px solid rgba(197, 155, 56, 0.45) !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    cursor: pointer;
  }
  .wb-btn.active {
    background: #C85A17 !important;
    border-color: #F6F4EE !important;
  }
  .wb-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    padding: 24px 16px 48px;
  }
  .device-shell {
    background: #0B3524;
    border: 2px solid #C59B38;
    border-radius: 28px;
    padding: 14px 10px 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .device-meta {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 8px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #F6F4EE;
  }
  .device-meta span {
    background: rgba(197, 155, 56, 0.22);
    color: #E5C56B;
    border: 1px solid rgba(197, 155, 56, 0.45);
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11px;
  }
  .device-frame {
    border: 0;
    border-radius: 18px;
    background: #F6F4EE;
    height: 760px;
  }
</style>
</head>
<body>
  <div class="wb-header">
    <div class="wb-title">
      <b>BORNTOWIN5 — Responsive Mobile Viewport Verification</b>
      <small>Emerald Sovereign Edition • Verified at 360px, 390px, 430px &amp; Desktop</small>
    </div>
    <div class="wb-controls">
      <button class="wb-btn active" id="btnPortalUser" onclick="setPortal('/member.html', this)">👤 User Portal (/member.html)</button>
      <button class="wb-btn" id="btnPortalAdmin" onclick="setPortal('/admin.html', this)">🛡️ Admin Portal (/admin.html)</button>
      <button class="wb-btn" id="btnPortalLTUser" onclick="setPortal('/leveltrack-member.html', this)">📊 LevelTrack Member</button>
      <button class="wb-btn" id="btnPortalLTAdmin" onclick="setPortal('/leveltrack-admin.html', this)">♛ LevelTrack Admin</button>
    </div>
  </div>

  <div class="wb-grid" id="viewportGrid">
    <div class="device-shell">
      <div class="device-meta"><b>Small Android</b><span>360px × 760px</span></div>
      <iframe class="device-frame" style="width:360px" src="/member.html" title="360px Mobile Viewport"></iframe>
    </div>
    <div class="device-shell">
      <div class="device-meta"><b>iPhone 14 / 15</b><span>390px × 760px</span></div>
      <iframe class="device-frame" style="width:390px" src="/member.html" title="390px Mobile Viewport"></iframe>
    </div>
    <div class="device-shell">
      <div class="device-meta"><b>Pro Max / Plus</b><span>430px × 760px</span></div>
      <iframe class="device-frame" style="width:430px" src="/member.html" title="430px Mobile Viewport"></iframe>
    </div>
  </div>

  <script>
    function setPortal(url, btn) {
      document.querySelectorAll('.wb-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      document.querySelectorAll('.device-frame').forEach(f => { f.src = url; });
    }
  </script>
</body>
</html>
