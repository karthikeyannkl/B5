<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V26 Level Tracking - Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Noto Sans Tamil",sans-serif}.demo{background:#171c2b;color:#fff;text-align:center;padding:7px;font-size:11px}.top{height:64px;background:#fff;border-bottom:1px solid #e5e8ef;display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:5}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#034A2B,#d39a42);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800}.brand b{display:block;font-size:15px}.brand small{display:block;color:#7b8496;font-size:10px}.wrap{max-width:760px;margin:auto;padding:15px 12px 35px}.hero{background:linear-gradient(135deg,#681733,#a82d53);color:#fff;border-radius:19px;padding:20px 18px;margin-bottom:13px}.hero h1{margin:8px 0 4px;font-size:27px}.hero p{margin:0;color:#f8e9ed;font-size:11px}.card{background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 5px 20px #00000008}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button,.btn{border:0;border-radius:10px;padding:11px;font-weight:750;cursor:pointer;font-size:12px;background:#f0f1f6;color:#30384d}.nav button.active{background:#075B35;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid #e5e8ef;border-radius:13px;padding:10px}.stat b{display:block;font-size:23px;color:#075B35}.stat span{font-size:10px;color:#788196}.member{border:1px solid #e4e8ef;border-radius:13px;padding:12px;margin-top:9px}.small{font-size:10px;color:#7b8496}.pill{display:inline-block;background:#eee1e6;color:#075B35;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}.info{background:#fff8fb;border-left:4px solid #075B35;padding:11px;border-radius:10px;font-size:11px;line-height:1.5}.success{background:#e1f4e7;color:#227442;border-radius:10px;padding:11px;font-size:11px;line-height:1.5}.warn{background:#fff0c2;color:#806000;border-radius:10px;padding:11px;font-size:11px;line-height:1.5;margin-top:9px}.primary,.send{background:#075B35;color:#fff;width:100%;margin-top:10px}.secondary{background:#fff;color:#075B35;border:1px solid #075B35;width:100%;padding:11px;border-radius:10px;font-weight:800}input,textarea{width:100%;padding:11px;border:1px solid #dfe3ec;border-radius:10px;font:inherit;background:#fff;margin:5px 0 10px}label{font-size:10px;font-weight:800}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee;font-size:12px}.row:last-child{border-bottom:0}.badge{padding:5px 9px;border-radius:20px;background:#e1f4e7;color:#227442;font-weight:800;font-size:10px}.sectionTitle{display:flex;justify-content:space-between;align-items:center}.level{border:1px solid #e4e8ef;border-radius:12px;margin:8px 0;overflow:hidden}.lh{display:flex;justify-content:space-between;padding:11px;background:#fafbfe;font-weight:800;font-size:11px;color:#075B35}.pay{padding:9px;border-top:1px solid #eee;font-size:11px}@media(max-width:480px){.nav{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}</style></head><body><header class="top"><div class="logo">B5</div><div class="brand"><b>BORNTOWIN5 ADMIN</b><small>Level Tracking • Control Center</small></div></header><main class="wrap">
<section class="hero"><span class="pill" style="background:#fff2;color:#fff">LEVEL TRACKING</span><h1>Sequential Upgrade Control</h1><p>Real member data • Sequential upgrade flow</p></section>
<div class="card"><div class="stats"><div class="stat"><b id="aLevel">—</b><span>Current Level</span></div><div class="stat"><b id="aRefs">—</b><span>Direct Referrals</span></div><div class="stat"><b id="aNext">—</b><span>Next Level</span></div></div></div>
<section class="card"><div class="title">Upgrade Request & Approval</div><div id="requestList"></div><div id="adminRequest"></div></section>
<section class="card" id="paymentCard"><div class="title">Send Payment To This Member</div><div id="selectedMemberInfo" class="small">Select a pending upgrade request above.</div>
<label>Receiver Name</label><input id="receiverName" value=""><label>Receiver Member ID</label><input id="receiverIdInput" value=""><label>Receiver Phone</label><input id="receiverPhone" value=""><label>Account Holder</label><input id="accountHolder" value=""><label>Bank Name</label><input id="bankName" value=""><label>Account Number</label><input id="accountNumber" value=""><label>IFSC</label><input id="ifsc" value=""><label>UPI</label><input id="upi" value=""><label>Amount</label><input id="amount" value=""><label>Admin Message</label><textarea id="adminMessage" rows="3"></textarea><button class="primary" onclick="sendDetails()">SEND PAYMENT DETAILS TO MEMBER</button></section>
<section class="card"><div class="title">Upgrade History</div><div id="history"></div></section>
</main>
<script>
const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
let state={members:[],requests:[],upgrades:[],payments:[]},selectedRequest=null;
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function member(id){return state.members.find(m=>m.memberId===id)||{}}
async function load(){try{state=await api('/api/leveltrack/admin/dashboard');render();}catch(e){$('requestList').innerHTML='<div class="warn">Server connection failed: '+esc(e.message)+'</div>'}}
function render(){
 const pending=(state.requests||[]).filter(r=>r.status!=='Completed');
 $('requestList').innerHTML=pending.length?pending.map(r=>{const m=member(r.memberId);return '<div class="member"><b>'+esc(m.name||r.memberId)+'</b><div class="small">'+esc(m.memberId||r.memberId)+' • '+esc(m.mobile||'')+' • L'+esc(m.level||r.from)+' → L'+esc(r.to)+'</div><button class="secondary" onclick="selectRequest(''+esc(r.id)+'')">VIEW / APPROVE REQUEST</button></div>'}).join(''):'<div class="warn">No active upgrade request.</div>';
 const r=selectedRequest||pending[0]||null;if(r&&!selectedRequest)selectRequest(r.id,false); else if(!r){$('aLevel').textContent='—';$('aRefs').textContent='—';$('aNext').textContent='—';$('adminRequest').innerHTML='<div class="warn">Waiting for a real member upgrade request.</div>';clearForm();}
 $('history').innerHTML=(state.upgrades||[]).filter(u=>u.adminApproved).map(u=>'<div class="member"><b>L'+u.from+' → L'+u.to+'</b><div class="small">Member: '+esc(u.memberId)+' • Amount: ₹'+Number(u.amount||0).toLocaleString()+' • UTR: '+esc(u.utr||'—')+'</div></div>').join('')||'<div class="small">No completed upgrade history yet.</div>';
}
function clearForm(){['receiverName','receiverIdInput','receiverPhone','accountHolder','bankName','accountNumber','ifsc','upi','amount','adminMessage'].forEach(id=>$(id).value='');$('selectedMemberInfo').textContent='Select a pending upgrade request above.'}
async function selectRequest(id,rerender=true){const r=state.requests.find(x=>x.id===id);if(!r)return;selectedRequest=r;const d=await api('/api/leveltrack/admin/member-details/'+encodeURIComponent(r.memberId));const m=d.member;$('aLevel').textContent='L'+m.level;$('aRefs').textContent=d.directReferrals;$('aNext').textContent=m.level>=7?'—':'L'+(Number(m.level)+1);$('selectedMemberInfo').innerHTML='<b>'+esc(m.name)+'</b> • '+esc(m.memberId)+' • '+esc(m.mobile)+' • Direct Referrals: '+d.directReferrals;$('adminRequest').innerHTML='<div class="success"><b>REQUEST: '+esc(m.name)+'</b><br>Member ID: '+esc(m.memberId)+'<br>Upgrade: L'+r.from+' → L'+r.to+'<br>Status: '+esc(r.status)+'</div>';if(rerender)renderFormFromExisting(r)}
function renderFormFromExisting(r){const u=state.upgrades.find(x=>x.requestId===r.id);$('receiverName').value=u?.payee||'';$('receiverIdInput').value=u?.payeeId||'';$('receiverPhone').value=u?.payeePhone||'';$('accountHolder').value=u?.accountHolder||'';$('bankName').value=u?.bank||'';$('accountNumber').value=u?.account||'';$('ifsc').value=u?.ifsc||'';$('upi').value=u?.upi||'';$('amount').value=u?.amount||({1:1000,2:3000,3:20000,4:100000,5:200000,6:500000}[r.from]||'');$('adminMessage').value=u?.adminMessage||''}
function sendDetails(){if(!selectedRequest)return alert('Select a pending upgrade request first.');const body={payee:$('receiverName').value.trim(),payeeId:$('receiverIdInput').value.trim(),payeePhone:$('receiverPhone').value.trim(),accountHolder:$('accountHolder').value.trim(),bank:$('bankName').value.trim(),account:$('accountNumber').value.trim(),ifsc:$('ifsc').value.trim(),upi:$('upi').value.trim(),amount:Number($('amount').value),adminMessage:$('adminMessage').value.trim()};if(!body.payeeId||!body.amount)return alert('Receiver Member ID and Amount are required.');api('/api/leveltrack/admin/requests/'+encodeURIComponent(selectedRequest.id)+'/assign',{method:'POST',body:JSON.stringify(body)}).then(()=>{alert('Payment details sent to member.');selectedRequest=null;load()}).catch(e=>alert(e.message))}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='LEVELTRACK_NAV')document.body.classList.add('embedded')});
load();setInterval(load,10000);
</script></body></html>
