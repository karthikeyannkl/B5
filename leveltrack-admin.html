<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level Tracking — Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f3;color:#17372c;font-family:Arial,sans-serif}.app{max-width:1000px;margin:auto}.head{background:#075B35;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:5}.head h2{margin:0 0 4px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:#f4f6f5;position:sticky;top:64px;z-index:4}.tabs button{border:0;border-radius:9px;padding:10px 5px;background:#e8eeeb;color:#17372c;font-weight:700;font-size:11px}.tabs button.active{background:#075B35;color:#fff}.page{padding:12px}.card{background:#fff;border:1px solid #DDE7E1;border-radius:14px;padding:14px;margin-bottom:12px}.title{font-weight:800;font-size:16px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{text-align:center;border:1px solid #DDE7E1;border-radius:11px;padding:11px}.stat b{display:block;font-size:22px;color:#075B35}.small{font-size:11px;color:#667085}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf1ef;font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800}.ok{background:#d9f8e8;color:#087f4f}.pending{background:#fff1c2;color:#765000}.wait{background:#edf0f5;color:#475467}.reject{background:#fde5e5;color:#b42318}.success,.warn,.info{padding:10px;border-radius:9px;margin:7px 0;font-size:12px;line-height:1.5}.success{background:#eaf8ed;color:#146b22}.warn{background:#fff6df;color:#765000}.info{background:#eef5ff;color:#174a83}button,input,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #ccd7d1;font:inherit}button{background:#075B35;color:#fff;border:0;font-weight:750;cursor:pointer;margin-top:6px}.secondary{background:#fff;color:#075B35;border:1px solid #075B35}.danger{background:#b42318}.search{display:grid;grid-template-columns:1fr 120px;gap:7px}.member{border:1px solid #DDE7E1;border-radius:11px;padding:11px;margin-top:8px}.tree{margin-top:8px}.node{border-left:3px solid #075B35;background:#f8faf9;border-radius:9px;padding:9px;margin:6px 0;font-size:11px}.children{margin-left:14px;border-left:1px dashed #aaa;padding-left:9px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:11px;vertical-align:top}.hidden{display:none}@media(max-width:600px){.tabs{grid-template-columns:repeat(2,1fr)}.grid,.search{grid-template-columns:1fr}}
</style></head><body><div class="app"><div class="head"><h2>LEVEL TRACKING — ADMIN</h2><small>Members • Upgrade • Payments • Final Approval</small></div><div class="tabs"><button id="tDashboard" onclick="showTab('dashboard')">📊 Dashboard</button><button id="tMembers" onclick="showTab('members')">👥 Members</button><button id="tUpgrade" onclick="showTab('upgrade')">🚀 Level Upgrade</button><button id="tPayments" onclick="showTab('payments')">💳 Payments</button></div><section id="dashboard" class="page"><div class="card"><div class="title">Level Counts</div><div class="grid" id="stats"></div></div><div class="card"><div class="title">Daily Upgrade Report</div><input id="reportDate" type="date" onchange="dailyReport()"><div id="daily"></div></div></section><section id="members" class="page hidden"><div class="card"><div class="title">Search Member</div><div class="search"><input id="q" placeholder="Name / Mobile / Member ID"><button onclick="searchMembers()">SEARCH</button></div><div id="results"></div><div id="memberView"></div></div></section><section id="upgrade" class="page hidden"><div class="card"><div class="title">Upgrade Requests</div><div id="requests"></div></div><div class="card"><div class="title">Payment Assignment</div><div id="assignState"></div><div id="assignForm" class="hidden"><input id="receiverName" placeholder="Receiver / Payee Name"><input id="receiverId" placeholder="Receiver Member ID"><input id="receiverPhone" placeholder="Receiver Phone"><input id="accountHolder" placeholder="Account Holder"><input id="bank" placeholder="Bank Name"><input id="account" placeholder="Account Number"><input id="ifsc" placeholder="IFSC"><input id="upi" placeholder="UPI"><input id="amount" type="number" placeholder="Amount"><textarea id="message" rows="3" placeholder="Admin Message"></textarea><button onclick="sendDetails()">SEND PAYMENT DETAILS TO MEMBER</button></div></div><div class="card"><div class="title">Final Approval</div><div id="finalList"></div></div></section><section id="payments" class="page hidden"><div class="card"><div class="title">Incoming Payment Approval</div><div id="incoming"></div></div></section></div><script>
let state={};let selectedRequest=null;const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function showTab(t){['dashboard','members','upgrade','payments'].forEach(x=>$(x).classList.toggle('hidden',x!==t));['Dashboard','Members','Upgrade','Payments'].forEach(x=>$('t'+x).classList.toggle('active',x.toLowerCase()===t));}
function treeNode(x){return `<div class="node"><b>${esc(x.name)}</b> <span class="badge ${x.status==='Verified'?'ok':'pending'}">${esc(x.status||'')}</span><div class="small">${esc(x.levelMemberId||x.memberId)} • ${esc(x.mobile||'')} • Level ${Number(x.level||1)}</div>${x.children?.length?`<div class="children">${x.children.map(treeNode).join('')}</div>`:''}</div>`}
async function load(){try{state=await api('/api/leveltrack/admin/dashboard');render();dailyReport()}catch(e){document.body.innerHTML='<div class="page"><div class="warn">Server connection failed: '+esc(e.message)+'</div></div>'}}
function render(){const lv=state.levels||{};$('stats').innerHTML=[1,2,3,4,5,6,7].map(l=>`<div class="stat"><b>${lv[l]||0}</b><span>LEVEL ${l}</span></div>`).join('');renderRequests();renderFinal();renderIncoming()}
function renderRequests(){const a=(state.requests||[]).filter(r=>r.status!=='Completed');$('requests').innerHTML=a.length?a.map(r=>`<div class="member"><b>${esc(r.memberName||r.memberId)}</b><div class="small">Member ID: ${esc(r.memberId)} • L${r.from} → L${r.to} • Direct referrals checked by server</div><span class="badge ${r.status==='Assigned'?'ok':'pending'}">${esc(r.status)}</span>${r.status==='Requested'?`<button onclick="prepare('${esc(r.id)}')">VIEW / SET PAYMENT DETAILS</button>`:''}</div>`).join(''):'<div class="info">No pending upgrade requests.</div>'}
async function prepare(rid){selectedRequest=(state.requests||[]).find(x=>x.id===rid);if(!selectedRequest)return;const d=await api('/api/leveltrack/admin/member-details/'+encodeURIComponent(selectedRequest.memberId));$('assignState').innerHTML=`<div class="success"><b>${esc(d.member.name)}</b><br>Member ID: ${esc(d.member.memberId)}<br>Current Level: ${d.member.level}<br>Direct Referrals: ${d.directReferrals}<br>Total Downline: ${d.totalDownline}<div class="tree">${treeNode(d.tree)}</div></div>`;$('assignForm').classList.remove('hidden');$('amount').value=selectedRequest.amount||''}
async function sendDetails(){if(!selectedRequest)return;const body={payee:$('receiverName').value.trim(),payeeId:$('receiverId').value.trim(),payeePhone:$('receiverPhone').value.trim(),accountHolder:$('accountHolder').value.trim(),bank:$('bank').value.trim(),account:$('account').value.trim(),ifsc:$('ifsc').value.trim(),upi:$('upi').value.trim(),amount:Number($('amount').value),adminMessage:$('message').value.trim()};try{await api('/api/leveltrack/admin/requests/'+encodeURIComponent(selectedRequest.id)+'/assign',{method:'POST',body:JSON.stringify(body)});selectedRequest=null;$('assignForm').classList.add('hidden');await load();alert('Payment details sent to member.')}catch(e){alert(e.message)}}
function renderFinal(){const a=state.upgrades||[];$('finalList').innerHTML=a.length?a.map(u=>{const can=u.memberPaid&&u.receiverApproved&&!u.adminApproved;return `<div class="member"><b>L${u.from} → L${u.to}</b><div class="small">Payer Member ID: ${esc(u.memberId)} • Receiver Member ID: ${esc(u.payeeId||'-')}<br>Amount: ₹${Number(u.amount||0).toLocaleString()} • UTR: ${esc(u.utr||'-')}</div><span class="badge ${u.adminApproved?'ok':can?'pending':'wait'}">${u.adminApproved?'APPROVED':can?'READY FOR FINAL APPROVAL':'WAITING'}</span>${can?`<button onclick="finalApprove('${esc(u.id)}')">FINAL APPROVE → ACTIVATE L${u.to}</button>`:''}</div>`}).join(''):'<div class="info">No upgrade records.</div>'}
async function finalApprove(id){try{await api('/api/leveltrack/admin/upgrades/'+encodeURIComponent(id)+'/final-approve',{method:'POST'});await load();alert('Upgrade approved and next level activated.')}catch(e){alert(e.message)}}
function renderIncoming(){const a=state.payments||[];$('incoming').innerHTML=a.length?a.map(p=>`<div class="member"><b>Receiver: ${esc(p.receiverMemberId)}</b><div class="small">From: ${esc(p.fromMemberId)} • Amount ₹${Number(p.amount||0).toLocaleString()} • UTR ${esc(p.utr||'-')}</div><span class="badge ${p.adminApproved?'ok':p.memberAccepted?'pending':'wait'}">${p.adminApproved?'ADMIN VERIFIED':p.memberAccepted?'RECEIVER CONFIRMED':'WAITING RECEIVER'}</span>${p.memberAccepted&&!p.adminApproved?`<button onclick="verify('${esc(p.id)}')">VERIFY PAYMENT</button>`:''}</div>`).join(''):'<div class="info">No incoming payments.</div>'}
async function verify(id){try{await api('/api/leveltrack/admin/payments/'+encodeURIComponent(id)+'/verify',{method:'POST'});await load();}catch(e){alert(e.message)}}
async function searchMembers(){const q=$('q').value.trim();if(!q)return;$('results').innerHTML='<div class="info">Searching...</div>';try{const d=await api('/api/leveltrack/admin/members?q='+encodeURIComponent(q));$('results').innerHTML=d.members.length?d.members.map(m=>`<div class="member"><b>${esc(m.name)}</b><div class="small">${esc(m.memberId)} • ${esc(m.mobile)} • Level ${m.level}</div><button onclick="viewMember('${esc(m.memberId)}')">VIEW MEMBER / REFERRAL TREE</button></div>`).join(''):'<div class="info">No member found.</div>'}catch(e){alert(e.message)}}
async function viewMember(id){try{const d=await api('/api/leveltrack/admin/member-details/'+encodeURIComponent(id));$('memberView').innerHTML=`<div class="card"><div class="title">Member Details</div>${Object.entries({Name:d.member.name,'Member ID':d.member.memberId,Mobile:d.member.mobile,Level:d.member.level,Status:d.member.status,'Direct Referrals':d.directReferrals,'Total Downline':d.totalDownline}).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}<div class="title" style="margin-top:10px">Referral Tree</div><div class="tree">${treeNode(d.tree)}</div></div>`}catch(e){alert(e.message)}}
async function dailyReport(){try{const date=$('reportDate').value||new Date().toISOString().slice(0,10);const d=await api('/api/leveltrack/admin/daily-report?date='+encodeURIComponent(date));$('reportDate').value=d.date;$('daily').innerHTML=`<div class="success"><b>${d.count}</b> approved upgrade(s) on ${esc(d.date)}</div>`+(d.upgrades||[]).map(u=>`<div class="row"><span>L${u.from} → L${u.to}<br>${esc(u.member?.name||'')}</span><b>₹${Number(u.amount||0).toLocaleString()}</b></div>`).join('')}catch(e){}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='LEVELTRACK_NAV')return;showTab(e.data.section==='members'?'members':e.data.section==='upgrade'?'upgrade':e.data.section==='payments'?'payments':'dashboard')});load();setInterval(load,5000);
</script></body></html>
