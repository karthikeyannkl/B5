<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level Tracking — Member</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#17372c;font-family:Arial,sans-serif}.app{max-width:700px;margin:auto;min-height:100vh;background:#fff}.head{background:#075B35;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:5}.head h2{margin:0 0 5px;font-size:20px}.head small{opacity:.85}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;background:#f4f6f5;position:sticky;top:65px;z-index:4}.tabs button{border:0;border-radius:9px;padding:10px 5px;background:#e8eeeb;color:#17372c;font-weight:700;font-size:11px}.tabs button.active{background:#075B35;color:#fff}.page{padding:12px}.card{border:1px solid #DDE7E1;border-radius:14px;padding:14px;margin-bottom:12px}.title{font-weight:800;font-size:16px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #edf1ef;font-size:13px}.row:last-child{border:0}.small{font-size:11px;color:#667085}.badge{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:800}.ok{background:#d9f8e8;color:#087f4f}.pending{background:#fff1c2;color:#765000}.wait{background:#edf0f5;color:#475467}.danger{background:#fde5e5;color:#b42318}.success,.warn,.info{padding:10px;border-radius:9px;margin:8px 0;font-size:12px;line-height:1.5}.success{background:#eaf8ed;color:#146b22}.warn{background:#fff6df;color:#765000}.info{background:#eef5ff;color:#174a83}button,input,textarea{width:100%;padding:11px;border-radius:9px;border:1px solid #ccd7d1;font:inherit}button{background:#075B35;color:#fff;border:0;font-weight:750;cursor:pointer;margin-top:7px}.secondary{background:#fff;color:#075B35;border:1px solid #075B35}.bank{background:#f8faf9;border:1px solid #DDE7E1;border-radius:10px;padding:10px}.bank div{padding:7px 0;border-bottom:1px solid #e8ecea;font-size:12px}.bank div:last-child{border:0}.bank b{display:inline-block;width:125px;color:#667085;font-size:10px}.level{border:1px solid #DDE7E1;border-radius:10px;margin:8px 0;overflow:hidden}.lh{display:flex;justify-content:space-between;padding:11px;background:#f7faf8;font-weight:800;font-size:12px;cursor:pointer}.pay{padding:9px;border-top:1px solid #eee;font-size:12px}.hidden{display:none}.tree{margin-top:8px}.node{border-left:3px solid #075B35;background:#f8faf9;border-radius:9px;padding:9px;margin:6px 0;font-size:11px}.children{margin-left:14px;border-left:1px dashed #aaa;padding-left:9px}@media(max-width:520px){.tabs{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><div class="head"><h2>LEVEL TRACKING</h2><small>Member • Upgrade • Earnings • Payments</small></div><div class="tabs"><button id="tDashboard" onclick="showTab('dashboard')">📊 Dashboard</button><button id="tUpgrade" onclick="showTab('upgrade')">🚀 Level Upgrade</button><button id="tEarnings" onclick="showTab('earnings')">💰 My Earnings</button><button id="tPayments" onclick="showTab('payments')">📥 Payments</button></div><section id="dashboard" class="page"><div class="card"><div class="title">My Membership</div><div id="profile"></div></div><div class="card"><div class="title">Direct Referral Progress</div><div id="progress"></div></div><div class="card"><div class="title">Referral Tree</div><div id="tree" class="tree"></div></div></section><section id="upgrade" class="page hidden"><div class="card"><div class="title">🚀 Level Upgrade</div><div id="upgradeStatus"></div><div id="payment"></div><div id="utr"></div></div><div class="card"><div class="title">Upgrade History</div><div id="history"></div></div></section><section id="earnings" class="page hidden"><div class="card"><div class="title">💰 My Earnings</div><div id="earnSummary"></div><div id="earningsBody"></div></div></section><section id="payments" class="page hidden"><div class="card"><div class="title">📥 Incoming Payments</div><div class="small">Receiver confirmation must be completed before Admin final verification.</div><div id="incoming"></div></div></section></div><script>
const id=localStorage.getItem('BORNTOWIN5_MEMBER_ID')||'';let state=null;const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function currentView(){return new URLSearchParams(location.search).get('view')||'dashboard'}
function showView(view){
  document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
  document.querySelectorAll('.page .card').forEach(x=>x.style.display='');
  const dash=document.getElementById('dashboard'), up=document.getElementById('upgrade'), earn=document.getElementById('earnings'), pay=document.getElementById('payments');
  if(view==='dashboard'){dash?.classList.remove('hidden');return}
  if(view==='membership'){dash?.classList.remove('hidden');const cs=dash?.querySelectorAll('.card')||[];cs.forEach((c,i)=>c.style.display=i===0?'':'none');return}
  if(view==='upgrade'){up?.classList.remove('hidden');const cs=up?.querySelectorAll('.card')||[];cs.forEach((c,i)=>c.style.display=i===0?'':'none');return}
  if(view==='history'){up?.classList.remove('hidden');const cs=up?.querySelectorAll('.card')||[];cs.forEach((c,i)=>c.style.display=i===1?'':'none');return}
  if(view==='payments'){pay?.classList.remove('hidden');return}
  if(view==='earnings'){earn?.classList.remove('hidden');return}
  dash?.classList.remove('hidden');
}
function showTab(t){showView(t)}
function treeNode(x){return `<div class="node"><b>${esc(x.name)}</b> <span class="badge ${x.status==='Verified'?'ok':'pending'}">${esc(x.status||'')}</span><div class="small">${esc(x.levelMemberId||x.memberId)} • ${esc(x.mobile||'')} • Level ${Number(x.level||1)}</div>${x.children?.length?`<div class="children">${x.children.map(treeNode).join('')}</div>`:''}</div>`}
function detail(k,v){return `<div class="row"><span>${esc(k)}</span><b>${esc(v||'-')}</b></div>`}
function render(){const m=state.member,need=state.requiredDirectReferrals||0,got=state.directReferrals||0; $('profile').innerHTML=detail('Name',m.name)+detail('Member ID',m.levelMemberId||m.memberId)+detail('Mobile',m.mobile)+detail('Status',m.status)+detail('Current Level','Level '+m.level);$('progress').innerHTML=m.level>=7?'<div class="success"><b>LEVEL 7 FINAL LEVEL</b> — No further upgrade.</div>':`<div class="row"><span>Current Level</span><b>L${m.level}</b></div><div class="row"><span>Direct Referrals</span><b>${got} / ${need}</b></div><div class="row"><span>Next Upgrade</span><b>L${m.level} → L${m.level+1}</b></div>${got>=need?'<div class="success">✓ Referral milestone completed.</div>':'<div class="warn">${need-got} more direct referral(s) required.</div>'}`;$('tree').innerHTML=treeNode(state.tree);renderUpgrade();renderEarnings();renderIncoming();renderHistory()}
function renderUpgrade(){const u=state.upgrade,m=state.member,need=state.requiredDirectReferrals||0,got=state.directReferrals||0;$('payment').innerHTML='';$('utr').innerHTML='';if(m.level>=7){$('upgradeStatus').innerHTML='<div class="success"><b>✓ LEVEL 7 ACTIVE</b><br>Final level completed.</div>';return}if(u?.adminApproved){$('upgradeStatus').innerHTML=`<div class="success"><b>✓ Upgrade completed</b><br>You are now Level ${m.level}.</div>`;return}if(!u){if(got<need){$('upgradeStatus').innerHTML=`<div class="warn"><b>L${m.level} → L${m.level+1}</b><br>Required Direct Referrals: ${need}<br>Your Direct Referrals: ${got} / ${need}<br>Remaining: ${need-got}</div>`}else{$('upgradeStatus').innerHTML=`<div class="success"><b>${got} DIRECT REFERRALS COMPLETE ✓</b><br>L${m.level} → L${m.level+1} is available.</div><button onclick="requestUpgrade()">REQUEST L${m.level} → L${m.level+1} UPGRADE</button>`}return}if(!u.detailsSent){$('upgradeStatus').innerHTML=`<div class="success">Upgrade request sent to Admin.<br><b>PAYMENT SENT BY MEMBER ID:</b> ${esc(m.levelMemberId||m.memberId)}</div><div class="warn">Waiting for Admin payment details.</div>`;return}$('upgradeStatus').innerHTML=`<div class="success">Admin payment details received for L${u.from} → L${u.to}.</div>`;$('payment').innerHTML='<div class="title">Payment Details</div><div class="bank">'+detail('Receiver Name',u.payee)+detail('Receiver Member ID',u.payeeId)+detail('Receiver Phone',u.payeePhone)+detail('Account Holder',u.accountHolder)+detail('Bank Name',u.bank)+detail('Account Number',u.account)+detail('IFSC',u.ifsc)+detail('UPI',u.upi)+detail('Amount','₹ '+Number(u.amount||0).toLocaleString())+'</div><div class="info">'+esc(u.adminMessage||'Please make the payment and submit UTR.')+'</div>';if(u.memberPaid){$('utr').innerHTML=`<div class="success"><b>PAYMENT SUBMITTED ✓</b><br>UTR: ${esc(u.utr)}<br>Waiting for Receiver confirmation and Admin verification.</div>`}else{$('utr').innerHTML='<input id="utrInput" placeholder="Enter UTR / Transaction Number"><button onclick="submitUTR()">SUBMIT PAYMENT</button>'}}
async function requestUpgrade(){try{await api('/api/leveltrack/member/upgrade-request',{method:'POST',body:JSON.stringify({memberId:id})});await load();showView(currentView());alert('Upgrade request sent to Admin.')}catch(e){alert(e.message)}}
async function submitUTR(){const u=state.upgrade,v=$('utrInput')?.value.trim();if(!u?.id||!v)return alert('Enter UTR.');try{await api('/api/leveltrack/member/upgrade/'+encodeURIComponent(u.id)+'/pay',{method:'POST',body:JSON.stringify({memberId:id,utr:v})});await load();alert('UTR submitted. Receiver confirmation is now required.')}catch(e){alert(e.message)}}
function renderEarnings(){const levels=state.levelEarnings||{};let total=0,count=0;for(let l=1;l<=7;l++){const a=levels[l]||[];a.forEach(p=>{if(p.status==='COMPLETED'){count++;total+=Number(p.amount||0)}})}$('earnSummary').innerHTML=detail('Confirmed Payment Count',count)+detail('Confirmed Amount','₹ '+total.toLocaleString())+'<div class="info">Tap a level to open only that level’s payment details.</div>'+[1,2,3,4,5,6,7].map(l=>{const a=levels[l]||[],done=a.filter(p=>p.status==='COMPLETED').length;return `<div class="level"><div class="lh" onclick="toggleLevel(${l})"><span>LEVEL ${l}</span><span>${done} / ${a.length} COMPLETED ▾</span></div><div id="el${l}" style="display:none">${a.length?a.map(p=>`<div class="pay"><b>${esc(p.from||p.fromMemberId||'-')}</b><br><span class="small">Member ID: ${esc(p.fromMemberId||'-')} • Amount: ₹${Number(p.amount||0).toLocaleString()} • ${esc(p.status)}</span></div>`).join(''):'<div class="pay">No payments recorded.</div>'}</div></div>`}).join('')}
function toggleLevel(l){const e=$('el'+l);e.style.display=e.style.display==='none'?'block':'none'}
function renderIncoming(){const a=state.incomingPayments||[];$('incoming').innerHTML=a.length?a.map(p=>`<div class="card"><b>${esc(p.from||p.fromMemberId)}</b><div class="small">Amount ₹${Number(p.amount||0).toLocaleString()} • UTR ${esc(p.utr||'-')}</div><span class="badge ${p.memberAccepted?'ok':'pending'}">${p.memberAccepted?'RECEIVER CONFIRMED':'PENDING RECEIVER CONFIRMATION'}</span>${p.memberAccepted?'<div class="success">✓ Receiver confirmation sent. Waiting for Admin verification.</div>':`<button onclick="acceptPayment('${esc(p.id)}')">✓ PAYMENT RECEIVED</button><button class="secondary" onclick="rejectPayment('${esc(p.id)}')">PAYMENT NOT RECEIVED</button>`}</div>`).join(''):'<div class="info">No incoming payments.</div>'}
async function acceptPayment(pid){try{await api('/api/leveltrack/member/incoming/'+encodeURIComponent(pid)+'/accept',{method:'POST',body:JSON.stringify({memberId:id})});await load();}catch(e){alert(e.message)}}
async function rejectPayment(pid){alert('Please contact Admin if the payment was not received. The current server flow does not mark a rejection separately.')}
function renderHistory(){const a=state.history||[];$('history').innerHTML=a.length?a.map(x=>`<div class="row"><span>L${x.from} → L${x.to}</span><span class="badge ${x.adminApproved?'ok':'pending'}">${x.adminApproved?'APPROVED':'PENDING'}</span></div><div class="small" style="padding:4px 0">Amount ₹${Number(x.amount||0).toLocaleString()} • ${esc(x.date||'')}</div>`).join(''):'<div class="info">No upgrade history yet.</div>'}
async function load(){if(!id){document.body.innerHTML='<div class="app"><div class="head"><h2>LEVEL TRACKING</h2></div><div class="page"><div class="warn">Member login required.</div></div></div>';return}try{state=await api('/api/leveltrack/member/dashboard/'+encodeURIComponent(id));render();showTab('dashboard')}catch(e){document.body.innerHTML='<div class="page"><div class="warn">Server connection failed: '+esc(e.message)+'</div></div>'}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='LEVELTRACK_NAV')return;showTab(e.data.section==='upgrade'?'upgrade':e.data.section==='payments'?'payments':e.data.section==='history'?'upgrade':e.data.section==='earnings'?'earnings':'dashboard')});load();setInterval(load,5000);
</script></body></html>
